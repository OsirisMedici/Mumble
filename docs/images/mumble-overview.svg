<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Mumble: speak and get it written</title>
  <desc id="desc">Local dictation for macOS and Windows. Press your shortcut, speak, and Mumble puts the transcript into the text field you are using. This is an explanatory illustration.</desc>
  <rect width="1120" height="620" rx="28" fill="#17241d"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(48 47)"><rect width="66" height="66" rx="18" fill="#223c2e"/><path d="M14 40c5 0 5-20 12-20s5 18 12 18 5-18 12-18 5 20 12 20" transform="translate(-5 0)" fill="none" stroke="#66d5a1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="132" y="92" font-size="38" font-weight="700" fill="#f3f7f4">Mumble</text>
    <text x="49" y="188" font-size="58" font-weight="700" fill="#f3f7f4">Speak. Get it written.</text>
    <text x="50" y="234" font-size="25" fill="#b7c8bd">Local dictation for macOS and Windows</text>
    <rect x="50" y="278" width="1020" height="144" rx="18" fill="#22352a" stroke="#3a5143"/>
    <text x="76" y="316" font-size="17" letter-spacing="2" fill="#8fe3b8">YOU SAY</text>
    <text x="76" y="357" font-size="29" fill="#f3f7f4">Let's meet tomorrow at ten.</text>
    <text x="76" y="393" font-size="20" fill="#b7c8bd">Mumble transcribes your words in the text field you are using.</text>
    <g fill="#66d5a1"><circle cx="70" cy="481" r="20"/><circle cx="420" cy="481" r="20"/><circle cx="760" cy="481" r="20"/></g>
    <g fill="#17241d" font-size="22" font-weight="700" text-anchor="middle"><text x="70" y="489">1</text><text x="420" y="489">2</text><text x="760" y="489">3</text></g>
    <g fill="#f3f7f4" font-size="25" font-weight="700"><text x="103" y="490">Press your shortcut</text><text x="453" y="490">Speak naturally</text><text x="793" y="490">Get your text</text></g>
    <text x="50" y="553" font-size="19" fill="#b7c8bd">Speech runs on your computer after you download a model.</text>
    <text x="50" y="586" font-size="16" fill="#8aa493">Workflow illustration · Free and open source</text>
  </g>
</svg>
