<svg xmlns="http://www.w3.org/2000/svg" width="540" height="680" viewBox="0 0 540 680" role="img" aria-labelledby="title desc">
  <title id="title">Mumble: speak and get it written</title>
  <desc id="desc">Local dictation for macOS and Windows. Use your shortcut, speak and get text. Explanatory illustration.</desc>
  <rect width="540" height="680" rx="24" fill="#17241d"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M35 64c9 0 9-28 19-28s9 25 19 25 8-25 19-25 8 28 19 28" fill="none" stroke="#66d5a1" stroke-width="8" stroke-linecap="round"/>
    <text x="132" y="67" font-size="36" font-weight="700" fill="#f3f7f4">Mumble</text>
    <text x="32" y="145" font-size="43" font-weight="700" fill="#f3f7f4">Speak.</text>
    <text x="32" y="198" font-size="43" font-weight="700" fill="#f3f7f4">Get it written.</text>
    <text x="32" y="246" font-size="24" fill="#b7c8bd">Local dictation for</text>
    <text x="32" y="279" font-size="24" fill="#b7c8bd">macOS and Windows</text>
    <rect x="32" y="313" width="476" height="112" rx="16" fill="#22352a" stroke="#3a5143"/>
    <text x="53" y="349" font-size="17" letter-spacing="2" fill="#8fe3b8">YOU SAY</text>
    <text x="53" y="391" font-size="26" fill="#f3f7f4">Let's meet tomorrow at ten.</text>
    <g fill="#66d5a1"><circle cx="52" cy="467" r="18"/><circle cx="52" cy="519" r="18"/><circle cx="52" cy="571" r="18"/></g>
    <g fill="#17241d" font-size="21" font-weight="700" text-anchor="middle"><text x="52" y="474">1</text><text x="52" y="526">2</text><text x="52" y="578">3</text></g>
    <g fill="#f3f7f4" font-size="25"><text x="85" y="476">Press your shortcut</text><text x="85" y="528">Speak naturally</text><text x="85" y="580">Get text in your active field</text></g>
    <text x="32" y="636" font-size="18" fill="#b7c8bd">Download a model. Dictate locally.</text>
    <text x="32" y="663" font-size="16" fill="#8aa493">Workflow illustration · Free and open source</text>
  </g>
</svg>
