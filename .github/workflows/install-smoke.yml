name: Verify public installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify Mac release
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/install/macos.sh --destination "$RUNNER_TEMP/Installed Mumble"
          APP="$RUNNER_TEMP/Installed Mumble/Mumble.app"
          codesign --verify --deep --strict "$APP"
          BEFORE_INODE=$(stat -f %i "$APP")
          bash scripts/install/macos.sh --destination "$RUNNER_TEMP/Installed Mumble"
          test "$(stat -f %i "$APP")" = "$BEFORE_INODE"
          "$APP/Contents/MacOS/karen-voice" --list-devices
      - name: Install and verify Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'Installed Mumble'
          ./scripts/install/windows.ps1 -Destination $destination
          $exe = Join-Path $destination 'karen-voice.exe'
          if ((Get-Item $exe).VersionInfo.ProductName -ne 'Mumble') { throw 'Wrong product' }
          $app = Start-Process $exe -ArgumentList '--list-devices' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw 'Installed engine failed startup' }
