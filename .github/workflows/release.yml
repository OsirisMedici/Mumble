name: Desktop preview release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build Windows too. Disable when a matching verified Windows PR artifact already exists.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx prettier --check .
      - run: bun run build
      - run: bun run test:keyboard

  build:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            platform: macos-latest
          - target: x86_64-apple-darwin
            platform: macos-15-intel
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - name: Install Intel ONNX Runtime
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          ORT_VERSION="1.24.2"
          curl --fail --location --retry 3 -o ort.tgz "https://blob.handy.computer/onnxruntime-osx-x86_64-${ORT_VERSION}.tgz"
          tar xzf ort.tgz
          ORT_DIR="$PWD/onnxruntime-osx-x86_64-${ORT_VERSION}"
          echo "ORT_LIB_LOCATION=$ORT_DIR/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          jq --arg lib "$ORT_DIR/lib/libonnxruntime.${ORT_VERSION}.dylib" '.bundle.macOS.frameworks = [$lib]' src-tauri/tauri.conf.json > config.tmp
          mv config.tmp src-tauri/tauri.conf.json
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build native app
        run: bun run tauri build --target ${{ matrix.target }} --bundles app -- --locked
      - name: Verify engine and package ZIP and DMG
        run: python3 scripts/ci/package-macos.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.build_windows
    uses: ./.github/workflows/windows-preview.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64-pc-windows-msvc
          path: release-assets
      - name: Publish preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --prerelease --title "Mumble 0.1.0 Preview" --notes-file docs/RELEASE_NOTES.md
